        <!-- GHL Lead Connector chat widget — RECRUITING program (A2P 10DLC).
             This tag is STATIC and must stay static. GHL's compliance checker
             fetches the raw HTML and greps for the script; a tag injected by
             React is invisible to it, and the check fails even though the
             widget works fine for real visitors.

             src/components/ChatWidget.tsx takes over at runtime: on non-
             recruiting routes it removes this widget and mounts the CUSTOMER
             one (69dc8296d0d6ea566ec47460) instead, so only one bubble is ever
             on the page.

             Known tradeoff: only the recruiting id is greppable in raw HTML, so
             a compliance check run against the CUSTOMER program on this domain
             would fail. Accepted deliberately — SoCal's A2P is already
             registered; the recruiting program is the one being reviewed. -->
        <script src="https://widgets.leadconnectorhq.com/loader.js"
                data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js"
                data-widget-id="6a74af1597ea74e60a4c73c6"
                data-source="WEB_USER"
                id="ghl-chat-widget"></script>
  </body>
